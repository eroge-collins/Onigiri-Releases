name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and verify health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code="$(curl -L -sS -o /tmp/render-health.txt -w '%{http_code}' --connect-timeout 10 --max-time 120 https://onigiri-web.onrender.com/api/health || true)"
            echo "Attempt $attempt: HTTP $code"
            cat /tmp/render-health.txt || true
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1
